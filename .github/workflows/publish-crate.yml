name: Publish crates.io

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always

concurrency:
  group: publish-crate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Weavatrix/weavatrix-seo'
    name: Publish workspace crates
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: crates-io
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 2026-07-29
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || { echo "CARGO_REGISTRY_TOKEN is not configured" >&2; exit 1; }
          CRATES=(
            weavatrix-seo-model
            weavatrix-seo-http
            weavatrix-seo-observation
            weavatrix-seo-source
            weavatrix-seo-render
            weavatrix-seo-gate
            weavatrix-seo-history
            weavatrix-seo-competitor
            weavatrix-seo-content
            weavatrix-seo-architecture
            weavatrix-seo-programmatic
            weavatrix-seo-claims
            weavatrix-seo-quality
            weavatrix-seo-rules
            weavatrix-seo-opportunity
            weavatrix-seo-semantic
            weavatrix-seo-nextjs
            weavatrix-seo-crawl
            weavatrix-seo
            weavatrix-seo-mcp
            weavatrix-seo-cli
          )
          metadata="$(cargo metadata --locked --format-version 1 --no-deps)"
          for crate in "${CRATES[@]}"; do
            version="$(jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version' <<<"$metadata")"
            [[ -n "$version" && "$version" != "null" ]] || { echo "missing crate $crate" >&2; exit 1; }
            if cargo info --color never --registry crates-io "$crate@$version" >/dev/null 2>&1; then
              echo "$crate@$version already published"
              continue
            fi
            echo "publishing $crate@$version"
            published=false
            for attempt in $(seq 1 60); do
              set +e
              output="$(cargo publish -p "$crate" --locked --no-verify 2>&1)"
              status=$?
              set -e
              printf '%s\n' "$output"
              if [[ "$status" -eq 0 ]]; then
                published=true
                break
              fi
              if printf '%s\n' "$output" | grep -q "already uploaded"; then
                echo "$crate@$version was uploaded concurrently"
                published=true
                break
              fi
              wait_secs=20
              if printf '%s\n' "$output" | grep -q "Too Many Requests"; then
                retry_after="$(printf '%s\n' "$output" | sed -n 's/.*try again after \(.*\) GMT and see.*/\1 GMT/p' | tail -n 1)"
                if [[ -n "$retry_after" ]]; then
                  now="$(date -u +%s)"
                  until_ts="$(date -u -d "$retry_after" +%s)"
                  wait_secs=$((until_ts - now + 15))
                else
                  wait_secs=600
                fi
                if (( wait_secs < 60 )); then
                  wait_secs=60
                fi
              fi
              echo "publish attempt $attempt/60 for $crate failed; waiting ${wait_secs}s"
              sleep "$wait_secs"
            done
            [[ "$published" == true ]] || { echo "failed to publish $crate@$version" >&2; exit 1; }
          done
      - name: Verify crates.io artifacts
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "weavatrix-seo") | .version')"
          for crate in weavatrix-seo weavatrix-seo-cli weavatrix-seo-mcp weavatrix-seo-model; do
            visible=false
            for attempt in $(seq 1 24); do
              if cargo info --color never --registry crates-io "$crate@$VERSION" >/dev/null 2>&1; then
                visible=true
                break
              fi
              sleep 5
            done
            [[ "$visible" == true ]] || { echo "$crate@$VERSION did not become visible on crates.io" >&2; exit 1; }
          done
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "weavatrix-seo") | .version')"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
      - name: Dispatch native npm publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run publish-npm.yml --ref "${{ github.ref_name }}"
