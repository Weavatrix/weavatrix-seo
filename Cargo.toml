[workspace]
resolver = "2"
members = [
    "crates/seo-model",
    "crates/seo-http",
    "crates/seo-crawl",
    "crates/seo-render",
    "crates/seo-source",
    "crates/seo-nextjs",
    "crates/seo-rules",
    "crates/seo-quality",
    "crates/seo-gate",
    "crates/seo-content",
    "crates/seo-semantic",
    "crates/seo-architecture",
    "crates/seo-programmatic",
    "crates/seo-claims",
    "crates/seo-opportunity",
    "crates/seo-observation",
    "crates/seo-competitor",
    "crates/seo-history",
    "crates/seo-engine",
    "apps/seo-cli",
    "apps/seo-mcp",
]
default-members = [
    "crates/seo-model",
    "crates/seo-http",
    "crates/seo-crawl",
    "crates/seo-render",
    "crates/seo-source",
    "crates/seo-nextjs",
    "crates/seo-rules",
    "crates/seo-quality",
    "crates/seo-gate",
    "crates/seo-content",
    "crates/seo-semantic",
    "crates/seo-architecture",
    "crates/seo-programmatic",
    "crates/seo-claims",
    "crates/seo-opportunity",
    "crates/seo-observation",
    "crates/seo-competitor",
    "crates/seo-history",
    "crates/seo-engine",
    "apps/seo-cli",
    "apps/seo-mcp",
]

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.88"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
license = "MIT"
homepage = "https://weavatrix.com"
repository = "https://github.com/Weavatrix/weavatrix-seo"
readme = "README.md"

[workspace.dependencies]
weavatrix-seo-model = { path = "crates/seo-model", version = "0.1.11" }
weavatrix-seo-http = { path = "crates/seo-http", version = "0.1.11" }
weavatrix-seo-crawl = { path = "crates/seo-crawl", version = "0.1.11" }
weavatrix-seo-render = { path = "crates/seo-render", version = "0.1.11" }
weavatrix-seo-source = { path = "crates/seo-source", version = "0.1.11" }
weavatrix-seo-nextjs = { path = "crates/seo-nextjs", version = "0.1.11" }
weavatrix-seo-rules = { path = "crates/seo-rules", version = "0.1.11" }
weavatrix-seo-quality = { path = "crates/seo-quality", version = "0.1.11" }
weavatrix-seo-gate = { path = "crates/seo-gate", version = "0.1.11" }
weavatrix-seo-content = { path = "crates/seo-content", version = "0.1.11" }
weavatrix-seo-semantic = { path = "crates/seo-semantic", version = "0.1.11" }
weavatrix-seo-architecture = { path = "crates/seo-architecture", version = "0.1.11" }
weavatrix-seo-programmatic = { path = "crates/seo-programmatic", version = "0.1.11" }
weavatrix-seo-claims = { path = "crates/seo-claims", version = "0.1.11" }
weavatrix-seo-opportunity = { path = "crates/seo-opportunity", version = "0.1.11" }
weavatrix-seo-observation = { path = "crates/seo-observation", version = "0.1.11" }
weavatrix-seo-competitor = { path = "crates/seo-competitor", version = "0.1.11" }
weavatrix-seo-history = { path = "crates/seo-history", version = "0.1.11" }
weavatrix-seo = { path = "crates/seo-engine", version = "0.1.11" }
weavatrix-seo-mcp = { path = "apps/seo-mcp", version = "0.1.11" }

flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

weavatrix-graph = "0.6.3"
weavatrix-parse = "0.3.3"
weavatrix-scan = "0.4.6"
weavatrix-semantic = "0.2.2"
mcport = "0.5.0"
blazingly-json = "0.1.0"

serde = { version = "1.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
